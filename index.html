<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单摆物理模拟器 - 人机协同程序设计</title>
  <style>
    :root {
      --bg: #1a1a24;
      --panel: #23232f;
      --text: #e6e6f0;
      --muted: #9a9ab0;
      --accent: #6c8cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      background: var(--bg);
    }
    .panel {
      width: 640px;
      max-width: 100%;
      margin-top: 20px;
      background: var(--panel);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .slider-row label {
      width: 64px;
      font-size: 14px;
      color: var(--muted);
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .slider-row .value {
      width: 72px;
      text-align: right;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #7d9bff; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <h1>单摆物理模拟器</h1>
  <div class="subtitle">意图驱动 · ReAct 闭环 · 单文件自包含</div>

  <canvas id="canvas" width="640" height="420"></canvas>

  <div class="panel">
    <div class="slider-row">
      <label>摆长 L</label>
      <input type="range" id="length" min="100" max="350" value="200" step="1">
      <span class="value" id="lengthVal">200 px</span>
    </div>
    <div class="slider-row">
      <label>重力 g</label>
      <input type="range" id="gravity" min="1" max="25" value="9.8" step="0.1">
      <span class="value" id="gravityVal">9.8</span>
    </div>
    <div class="slider-row">
      <label>阻尼 k</label>
      <input type="range" id="damping" min="0" max="0.010" value="0.001" step="0.0001">
      <span class="value" id="dampingVal">0.0010</span>
    </div>
    <button id="resetBtn">重置摆动</button>
  </div>

  <script>
    (function () {
      "use strict";

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const lengthInput = document.getElementById("length");
      const gravityInput = document.getElementById("gravity");
      const dampingInput = document.getElementById("damping");
      const lengthVal = document.getElementById("lengthVal");
      const gravityVal = document.getElementById("gravityVal");
      const dampingVal = document.getElementById("dampingVal");
      const resetBtn = document.getElementById("resetBtn");

      const PIVOT_X = canvas.width / 2;
      const PIVOT_Y = 60;
      const BALL_RADIUS = 18;
      const INITIAL_ANGLE = (45 * Math.PI) / 180;

      let length = parseFloat(lengthInput.value);
      let gravity = parseFloat(gravityInput.value);
      let damping = parseFloat(dampingInput.value);

      let theta = INITIAL_ANGLE;
      let omega = 0;

      function computeAlpha() {
        return -(gravity / length) * Math.sin(theta) - damping * omega;
      }

      function step(dt) {
        const alpha = computeAlpha();
        omega += alpha * dt;
        theta += omega * dt;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const ballX = PIVOT_X + length * Math.sin(theta);
        const ballY = PIVOT_Y + length * Math.cos(theta);

        ctx.fillStyle = "#4a4a5c";
        ctx.beginPath();
        ctx.arc(PIVOT_X, PIVOT_Y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#6c8cff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(PIVOT_X, PIVOT_Y);
        ctx.lineTo(ballX, ballY);
        ctx.stroke();

        const glow = ctx.createRadialGradient(ballX, ballY, 2, ballX, ballY, BALL_RADIUS * 2.5);
        glow.addColorStop(0, "rgba(108, 140, 255, 0.45)");
        glow.addColorStop(1, "rgba(108, 140, 255, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(ballX, ballY, BALL_RADIUS * 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#e6e6f0";
        ctx.beginPath();
        ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }

      let lastTime = performance.now();

      function animate(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        for (let i = 0; i < 4; i++) {
          step(dt / 4);
        }

        draw();
        requestAnimationFrame(animate);
      }

      function updateLength() {
        length = parseFloat(lengthInput.value);
        lengthVal.textContent = length + " px";
      }
      function updateGravity() {
        gravity = parseFloat(gravityInput.value);
        gravityVal.textContent = gravity.toFixed(1);
      }
      function updateDamping() {
        damping = parseFloat(dampingInput.value);
        dampingVal.textContent = damping.toFixed(4);
      }

      lengthInput.addEventListener("input", updateLength);
      gravityInput.addEventListener("input", updateGravity);
      dampingInput.addEventListener("input", updateDamping);

      function resetAnimation() {
        theta = INITIAL_ANGLE;
        omega = 0;
      }

      resetBtn.addEventListener("click", resetAnimation);

      updateLength();
      updateGravity();
      updateDamping();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
